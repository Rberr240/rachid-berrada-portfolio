<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms — détection (contact)</title>
  </head>
  <body>
    <!--
      Fichier statique dédié à la détection du formulaire par le crawler
      Netlify Forms au build (Next.js runtime v5 / @netlify/plugin-nextjs).
      Jamais servi ni affiché aux visiteurs : le formulaire interactif réel
      est src/components/forms/ProjectForm.tsx, qui soumet en AJAX vers "/".
      Les noms des champs ci-dessous doivent rester strictement identiques
      à ceux de ProjectForm.tsx.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
